name: "TERRAFORM TOOLING CALLER WORKFLOW"
on:
  pull_request:
    branches:
     - main
    paths:
     - 'environments/tooling/**'
     - 'modules/**'
     - '.github/workflows/**'
    
  push:
    branches:
     - main
    paths:
     - 'environments/tooling/**'
     - 'modules/**'
     - '.github/workflows/**'
jobs:
  tooling:
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      environment: tooling

