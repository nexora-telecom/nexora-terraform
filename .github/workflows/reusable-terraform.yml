name: Reusable Terraform Workflow Engine
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment (tooling or prod)"
jobs:
  terraform:
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: environments/${{inputs.environment}}
    steps:
    - name: "Pull the code from github"
      uses: actions/checkout@v4
    - name: "Gate 1: Terraform Format Check"
      if: github.event_name == 'pull_request'
      run: terraform fmt -check
    - name: "Setup TFLint"
      if: github.event_name == 'pull_request'
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: latest
    - name: "Gate 2: Run TFLint"
      if: github.event_name == 'pull_request'
      run: |
        tflint --init
        tflint --recursive
    - name: "Gate 3: Security & Misconfiguration Scan (Trivy)"
      if: github.event_name == 'pull_request'
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        scan-ref: '.'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'
    - name: "Gate 4: Terraform Init & Validate"
      if: github.event_name == 'pull_request'
      run: |
        terraform init
        terraform validate
    - name: "Gate 5: Terraform Speculative Plan"
      if: github.event_name == 'pull_request'
      run: terraform plan
    - name: "If merge to main: Plan with detailed-exitcode and apply only if changes exist"
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        terraform init
        
        # Disable exit-on-error temporarily so bash does not abort on exit code 2 (diff present)
        set +e
        terraform plan -detailed-exitcode -out=tfplan
        PLAN_EXIT=$?
        set -e

        if [ $PLAN_EXIT -eq 0 ]; then
          echo "=========================================================="
          echo "  NO CHANGES DETECTED: Skipping apply for ${{ inputs.environment }}"
          echo "=========================================================="
        elif [ $PLAN_EXIT -eq 2 ]; then
          echo "=========================================================="
          echo "  CHANGES DETECTED: Applying saved plan (tfplan)...       "
          echo "=========================================================="
          terraform apply tfplan
        else
          echo "=========================================================="
          echo "  TERRAFORM PLAN FAILED WITH ERROR CODE: $PLAN_EXIT       "
          echo "=========================================================="
          exit $PLAN_EXIT
        fi