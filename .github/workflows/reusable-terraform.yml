name: Reusable Terraform Workflow Engine
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment (tooling or prod)"
jobs:
  terraform:
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: environments/${{inputs.environment}}
    steps:
    - name: "Pull the code from github"
      uses: actions/checkout@v4
    - name: "If it is a Pull Request to main then Terraform shell commands (fmt -check, init, validate, plan)"
      if: github.event_name == 'pull_request'
      run: |
        terraform fmt -check
        terraform init
        terraform validate
        terraform plan
    - name: "If merge to main: Plan with detailed-exitcode and apply only if changes exist"
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        terraform init
        
        # Disable exit-on-error temporarily so bash does not abort on exit code 2 (diff present)
        set +e
        terraform plan -detailed-exitcode -out=tfplan
        PLAN_EXIT=$?
        set -e

        if [ $PLAN_EXIT -eq 0 ]; then
          echo "=========================================================="
          echo "  NO CHANGES DETECTED: Skipping apply for ${{ inputs.environment }}"
          echo "=========================================================="
        elif [ $PLAN_EXIT -eq 2 ]; then
          echo "=========================================================="
          echo "  CHANGES DETECTED: Applying saved plan (tfplan)...       "
          echo "=========================================================="
          terraform apply tfplan
        else
          echo "=========================================================="
          echo "  TERRAFORM PLAN FAILED WITH ERROR CODE: $PLAN_EXIT       "
          echo "=========================================================="
          exit $PLAN_EXIT
        fi